name: Parrett Line
accent_color: "#7a2e2e"  # burgundy
migration: Ohio → Indiana
intro: |
  The Parrett line traces from early-19th-century Ohio through generations of
  Indiana farmers, merchants, and tradesmen. Amos Parret died serving in the
  Union Army in 1863; his descendants put down roots in Wabash and Whitley
  Counties before the line migrated outward in the twentieth century.

