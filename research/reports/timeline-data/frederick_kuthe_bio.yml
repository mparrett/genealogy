  after_paragraph: 1
  description: >
    Frederick's birthplace is recorded as "Darmstadt" on the 1870
    census — likely referring to the Grand Duchy of Hesse-Darmstadt
    rather than the city itself. No immigration record has been
    confirmed for the Kuthe family; a Baltimore 1834 passenger
    record once attributed to them was found to belong to a
    different family named Huth.

